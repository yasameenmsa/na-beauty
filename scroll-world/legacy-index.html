<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NABeauty3D Scroll World</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; }

  .scroll-container {
    position: relative;
    height: 900vh; /* long scroll track */
  }

  .viewport {
    position: sticky;
    top: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #0f0f0f;
  }

  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1), transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    transform: scale(1.05);
  }

  .slide.active {
    opacity: 1;
    transform: scale(1);
    z-index: 2;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.35) 100%);
    z-index: 3;
    pointer-events: none;
  }

  .scene-text {
    position: absolute;
    bottom: 12%;
    left: 6%;
    max-width: 520px;
    z-index: 4;
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .scene-text.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .scene-label {
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #c8e6c9;
    margin-bottom: 0.5rem;
  }

  .scene-title {
    font-size: clamp(2rem, 5vw, 4rem);
    font-weight: 300;
    line-height: 1.1;
    margin-bottom: 1rem;
  }

  .scene-desc {
    font-size: 1rem;
    line-height: 1.5;
    color: rgba(255,255,255,0.85);
  }

  .progress-bar {
    position: fixed;
    top: 0;
    left: 0;
    height: 4px;
    background: #c8e6c9;
    width: 0%;
    z-index: 10;
  }

  .cta-final {
    position: absolute;
    bottom: 15%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    text-align: center;
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
  }

  .cta-final.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .cta-final h2 {
    font-size: clamp(1.5rem, 4vw, 3rem);
    font-weight: 300;
    margin-bottom: 1.5rem;
  }

  .cta-final a {
    display: inline-block;
    padding: 1rem 2.5rem;
    background: #c8e6c9;
    color: #0f0f0f;
    text-decoration: none;
    border-radius: 50px;
    font-weight: 600;
    letter-spacing: 0.05em;
    transition: transform 0.2s ease, background 0.2s ease;
  }

  .cta-final a:hover {
    transform: scale(1.05);
    background: #fff;
  }

  @media (max-width: 768px) {
    .scene-text { left: 5%; right: 5%; max-width: none; bottom: 10%; }
    .scene-title { font-size: 2rem; }
  }
</style>
</head>
<body>
  <div class="progress-bar" id="progressBar"></div>

  <div class="scroll-container" id="scrollContainer">
    <div class="viewport" id="viewport">

      <div class="scene-text" id="sceneText">

        <h1 class="scene-title" id="sceneTitle"></h1>
        <p class="scene-desc" id="sceneDesc"></p>
      </div>
      <div class="cta-final" id="ctaFinal">

const folderMap = {
  'NA Beauty Branding': encodeURIComponent('NA Beauty Branding'),
  'Ground Floor': encodeURIComponent('تعديل الدور الارضي ( الكراسي)'),
  'Second Floor': encodeURIComponent('تعديل الدور الثاني 4')
};

const slidesContainer = document.getElementById('slides');
const sceneLabel = document.getElementById('sceneLabel');
const sceneTitle = document.getElementById('sceneTitle');
const sceneDesc = document.getElementById('sceneDesc');
const sceneText = document.getElementById('sceneText');
const progressBar = document.getElementById('progressBar');
const ctaFinal = document.getElementById('ctaFinal');

scenes.forEach((s, i) => {
  const div = document.createElement('div');
  div.className = 'slide' + (i === 0 ? ' active' : '');
  div.dataset.index = i;
  const img = document.createElement('img');
  img.src = '../processed/' + folderMap[s.folder] + '/' + encodeURIComponent(s.file);
  img.alt = s.title;
  div.appendChild(img);
  slidesContainer.appendChild(div);
});

function updateScene(index) {
  const s = scenes[index];
  sceneLabel.textContent = s.label;
  sceneTitle.textContent = s.title;
  sceneDesc.textContent = s.desc;

  document.querySelectorAll('.slide').forEach((slide, i) => {
    slide.classList.toggle('active', i === index);
  });

  const isFinal = index >= scenes.length - 2;
  sceneText.classList.toggle('visible', !isFinal);
  ctaFinal.classList.toggle('visible', isFinal);
}

function onScroll() {
  const container = document.getElementById('scrollContainer');
  const scrolled = window.scrollY;
  const maxScroll = container.offsetHeight - window.innerHeight;
  const progress = Math.max(0, Math.min(1, scrolled / maxScroll));
  progressBar.style.width = (progress * 100) + '%';

  const index = Math.min(scenes.length - 1, Math.floor(progress * scenes.length));
  updateScene(index);
}

window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', onScroll);
updateScene(0);
</script>
</body>
</html>
